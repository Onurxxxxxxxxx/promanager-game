<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyahbeyazfc - Menajerlik Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .header { border-bottom: 3px solid #fff; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: #1a1a1a; border-radius: 10px; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .pos { background: #fff; color: #000; padding: 5px; font-weight: bold; border-radius: 5px; min-width: 30px; }
        .power { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦅 Siyahbeyazfc</h1>
        <p id="takim-bilgi">Veriler yükleniyor...</p>
    </div>
    <div id="kadro-listesi">Sahaya çıkılıyor...</div>

    <script>
        const SUPABASE_URL = 'https://teyrakdvfqydhcnmwump.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_nMeoN53F6t1BY4wU9x8q2g_Jb1ea8hj';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function yukle() {
            const { data: takim } = await supabase.from('takimlar').select('*').eq('isim', 'Siyahbeyazfc').single();
            if(takim) {
                document.getElementById('takim-bilgi').innerText = `Bütçe: ${takim.butce.toLocaleString()} € | Puan: ${takim.puan}`;
                const { data: oyuncular } = await supabase.from('oyuncular').select('*').eq('takim_id', takim.id);
                let html = "";
                oyuncular.forEach(o => {
                    html += `<div class="card"><div class="pos">${o.mevki}</div><div>${o.isim}</div><div class="power">${o.guc}</div></div>`;
                });
                document.getElementById('kadro-listesi').innerHTML = html;
            }
        }
        yukle();
    </script>
</body>
</html>
